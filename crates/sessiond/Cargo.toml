[package]
name = "aurora-sessiond"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aurora-sessiond"
path = "src/main.rs"

[lib]
name = "aurora_sessiond"
path = "src/lib.rs"

[dependencies]
aurora-core = { version = "0.1.0", path = "../core" }
parking_lot = "0.13.0"
portable-pty = "0.9.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde_json = "1.0.154"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
