[package]
name = "aurora-core"
version = "0.1.0"
edition = "2024"

[dependencies]
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
notify-debouncer-full = "0.7.0"
nucleo-matcher = "0.3.1"
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[target.'cfg(windows)'.dependencies]
interprocess = "2.4.7"

[dev-dependencies]
tempfile = "3.27.0"
